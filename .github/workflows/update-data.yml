name: Update XE rates

on:
  schedule:
    - cron: "17 * * * *"   # every hour; XE publishes a new table once a day, so most runs change nothing
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new rates from XE
        run: python scripts/update_data.py
      - name: Commit when the data changed
        run: |
          if [ -n "$(git status --porcelain data/rates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rates.json
            git commit -m "Update XE rates"
            git push
          fi
